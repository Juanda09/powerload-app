name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Create archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PowerLoad.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/PowerLoad.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../PowerLoad.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PowerLoad-IPA
          path: PowerLoad.ipa
          if-no-files-found: error
