name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Show generated APK files
        run: |
          echo "=== APK files generated ==="
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Prepare Release APK
        run: |
          APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated"
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" PowerLoad-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerLoad-Release
          path: PowerLoad-release.apk
          if-no-files-found: error
